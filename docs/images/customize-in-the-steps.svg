<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 536" width="680" height="536" role="img" aria-labelledby="title desc">
  <title id="title">Customize inside the wizard steps</title>
  <desc id="desc">The four wizard steps run left to right. On the Machine step, Customize opens the editor, which starts from the applied options in the main enquiry form; Continue is unavailable while it is open. Apply, Cancel or leaving the step close it, and the wizard is back in the step sequence.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; text-anchor: middle; }
    .title { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; }
    .step rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .step .title { fill: #2C2C2A; }
    .step .sub { fill: #5F5E5A; }
    .editor rect { fill: #EEEDFE; stroke: #534AB7; }
    .editor .title { fill: #3C3489; }
    .editor .sub { fill: #534AB7; }
    .form rect { fill: #E1F5EE; stroke: #0F6E56; }
    .form .title { fill: #085041; }
    .form .sub { fill: #0F6E56; }
    .frame { fill: none; stroke: #B4B2A9; stroke-dasharray: 5 4; }
    .frame-title { fill: #2C2C2A; text-anchor: start; }
    .frame-sub { fill: #5F5E5A; text-anchor: start; }
    .line { fill: none; stroke: #888780; stroke-width: 1.5; }
    .head { fill: none; stroke: #888780; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .step rect { fill: #2C2C2A; stroke: #B4B2A9; }
      .step .title { fill: #F1EFE8; }
      .step .sub { fill: #D3D1C7; }
      .editor rect { fill: #26215C; stroke: #AFA9EC; }
      .editor .title { fill: #EEEDFE; }
      .editor .sub { fill: #CECBF6; }
      .form rect { fill: #04342C; stroke: #5DCAA5; }
      .form .title { fill: #E1F5EE; }
      .form .sub { fill: #9FE1CB; }
      .frame { stroke: #5F5E5A; }
      .frame-title { fill: #F1EFE8; }
      .frame-sub { fill: #B4B2A9; }
      .line, .head { stroke: #B4B2A9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M2 1L8 5L2 9"/>
    </marker>
  </defs>

  <g class="step"><rect x="50" y="40" width="130" height="56" rx="8" stroke-width="0.75"/><text class="title" x="115" y="60">Equipment</text><text class="sub" x="115" y="78">Choose a category</text></g>
  <g class="step"><rect x="200" y="40" width="130" height="56" rx="8" stroke-width="0.75"/><text class="title" x="265" y="60">Machine</text><text class="sub" x="265" y="78">Choose a machine</text></g>
  <g class="step"><rect x="350" y="40" width="130" height="56" rx="8" stroke-width="0.75"/><text class="title" x="415" y="60">Requirements</text><text class="sub" x="415" y="78">Your answers</text></g>
  <g class="step"><rect x="500" y="40" width="130" height="56" rx="8" stroke-width="0.75"/><text class="title" x="565" y="60">Review</text><text class="sub" x="565" y="78">Check and send</text></g>
  <line class="line" x1="182" y1="68" x2="198" y2="68" marker-end="url(#arrow)"/>
  <line class="line" x1="332" y1="68" x2="348" y2="68" marker-end="url(#arrow)"/>
  <line class="line" x1="482" y1="68" x2="498" y2="68" marker-end="url(#arrow)"/>

  <rect class="frame" x="40" y="140" width="600" height="282" rx="12" stroke-width="0.75"/>
  <text class="title frame-title" x="430" y="170">Customize</text>
  <text class="sub frame-sub" x="430" y="190">Machine step only</text>

  <line class="line" x1="265" y1="96" x2="265" y2="178" marker-end="url(#arrow)"/>
  <g class="editor"><rect x="180" y="180" width="170" height="56" rx="8" stroke-width="0.75"/><text class="title" x="265" y="200">Customize</text><text class="sub" x="265" y="218">Opens the editor</text></g>
  <line class="line" x1="265" y1="236" x2="265" y2="264" marker-end="url(#arrow)"/>
  <g class="editor"><rect x="180" y="266" width="170" height="56" rx="8" stroke-width="0.75"/><text class="title" x="265" y="286">Editor open</text><text class="sub" x="265" y="304">Continue unavailable</text></g>
  <g class="form"><rect x="420" y="266" width="200" height="56" rx="8" stroke-width="0.75"/><text class="title" x="520" y="286">Main enquiry form</text><text class="sub" x="520" y="304">Applied options</text></g>
  <line class="line" x1="418" y1="294" x2="352" y2="294" marker-end="url(#arrow)"/>

  <path class="line" d="M265 322V336"/>
  <path class="line" d="M150 336H530"/>
  <line class="line" x1="150" y1="336" x2="150" y2="350" marker-end="url(#arrow)"/>
  <line class="line" x1="340" y1="336" x2="340" y2="350" marker-end="url(#arrow)"/>
  <line class="line" x1="530" y1="336" x2="530" y2="350" marker-end="url(#arrow)"/>
  <g class="editor"><rect x="65" y="352" width="170" height="56" rx="8" stroke-width="0.75"/><text class="title" x="150" y="372">Apply</text><text class="sub" x="150" y="390">Writes the enquiry form</text></g>
  <g class="editor"><rect x="255" y="352" width="170" height="56" rx="8" stroke-width="0.75"/><text class="title" x="340" y="372">Cancel</text><text class="sub" x="340" y="390">Edits are discarded</text></g>
  <g class="editor"><rect x="445" y="352" width="170" height="56" rx="8" stroke-width="0.75"/><text class="title" x="530" y="372">Leaving the step</text><text class="sub" x="530" y="390">or changing equipment</text></g>
  <line class="line" x1="150" y1="408" x2="150" y2="438" marker-end="url(#arrow)"/>
  <line class="line" x1="340" y1="408" x2="340" y2="438" marker-end="url(#arrow)"/>
  <line class="line" x1="530" y1="408" x2="530" y2="438" marker-end="url(#arrow)"/>

  <g class="step"><rect x="100" y="440" width="480" height="56" rx="8" stroke-width="0.75"/><text class="title" x="340" y="460">Back in the step sequence</text><text class="sub" x="340" y="478">Editor closed, Continue available</text></g>
</svg>
